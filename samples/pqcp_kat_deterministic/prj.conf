# PQCP KAT Deterministic Sample
# WARNING: This configuration is for testing ONLY!

CONFIG_PQCP=y
CONFIG_PQCP_MLKEM=y
CONFIG_PQCP_MLKEM_LEVEL_768=y
CONFIG_PQCP_MLDSA=y
CONFIG_PQCP_MLDSA_LEVEL_65=y

# DETERMINISTIC RNG - TEST ONLY!
CONFIG_PQCP_RNG_CUSTOM=y
CONFIG_PQCP_RNG_DETERMINISTIC_TEST=y

# Disable real entropy for testing
# CONFIG_ENTROPY_GENERATOR is not set

# Stack for crypto operations (ML-DSA needs ~86KB)
CONFIG_MAIN_STACK_SIZE=131072

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=n
