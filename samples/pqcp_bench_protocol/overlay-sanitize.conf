# Native-simulator sanitizer coverage for the protocol benchmark sample.
#
# ASan/UBSan check for memory bugs and UB — a single iteration is
# sufficient to exercise every crypto + mbedTLS path once. The default
# 5-iteration benchmark loop (prj.conf) is a perf run, not a coverage
# run, and multiplies native_sim + sanitizer runtime by 5x to no
# additional coverage benefit. Lowering it here keeps the release-gate
# sanitizer step within its 1200s budget on GitHub-hosted runners.

CONFIG_ASAN=y
CONFIG_UBSAN=y
CONFIG_PQCP_BENCH_ITERATIONS=1
