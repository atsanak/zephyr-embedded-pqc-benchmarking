# PQCP Protocol Benchmark Sample
CONFIG_PQCP=y
CONFIG_PQCP_TLS_SELFTEST=y
CONFIG_PQCP_MLKEM=y
CONFIG_PQCP_MLDSA=y

# Production-safe entropy source for benchmark runs
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PQCP_RNG_ZEPHYR_ENTROPY=y

# Benchmarking and stack analysis
CONFIG_PQCP_BENCH=y
CONFIG_PQCP_BENCH_ITERATIONS=5
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# Stack sizing for ML-DSA-87
CONFIG_MAIN_STACK_SIZE=131072

# Logging and timing
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=n
CONFIG_TIMING_FUNCTIONS=y
