# PQCP TLS mbedTLS PSA Sample - Base Configuration
CONFIG_PQCP=y
CONFIG_PQCP_TLS_SELFTEST=y
CONFIG_PQCP_MLKEM=y
CONFIG_PQCP_MLKEM_LEVEL_768=y
CONFIG_PQCP_MLDSA=y
CONFIG_PQCP_MLDSA_LEVEL_65=y

# RNG
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PQCP_RNG_PSA=y

# PSA Driver
CONFIG_PQCP_PSA_DRIVER=y
CONFIG_PQCP_PSA_DRIVER_MLDSA=y
CONFIG_PQCP_PSA_DRIVER_MLKEM=y

# Stack
# Match the validated PQC self-test stack budget used by the protocol bench
# and TLS helper tests.
CONFIG_MAIN_STACK_SIZE=131072

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_PRINTK=n
