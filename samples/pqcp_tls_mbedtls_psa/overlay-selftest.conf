# PQCP TLS mbedTLS PSA Overlay - Selftest Only (No Networking)
# Use this for running crypto selftests without host network setup
#
# Build: west build -b qemu_x86_64 -- -DOVERLAY_CONFIG=overlay-selftest.conf

# mbedTLS configuration
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=131072

# PSA Crypto (required for PSA driver tests)
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# No networking - selftest only
CONFIG_NETWORKING=n
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
