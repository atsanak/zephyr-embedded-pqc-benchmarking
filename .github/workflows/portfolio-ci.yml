name: Public portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    name: Evidence and repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify retained result artifacts
        run: python scripts/verify_public_artifacts.py

      - name: Compile Python tooling
        run: python -m compileall -q scripts

      - name: Test west runner failure and timeout handling
        run: python scripts/test_check_zephyr.py

      - name: Check shell tooling
        run: |
          bash -n scripts/build.sh
          bash -n scripts/run_benchmark.sh
          bash -n scripts/check_host_c.sh

      - name: Reject accidentally tracked local material
        run: |
          if git ls-files | grep -E '(^|/)(build|build-[^/]*|\.venv|__pycache__)/|(^|/)\.env(\.[^/]*)?$|\.(pem|key)$'; then
            echo "local build, environment, or key material is tracked"
            exit 1
          fi

  advisor:
    name: Allocation-free C evidence
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run deterministic advisor and campaign checks
        run: bash scripts/check_host_c.sh

      - name: Run address and undefined-behavior sanitizers
        run: SANITIZE=1 bash scripts/check_host_c.sh

  zephyr:
    name: Zephyr QEMU firmware smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out repository and pinned native backends
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build prerequisites and west
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build device-tree-compiler gperf gcc g++ xz-utils wget libsdl2-dev
          python -m pip install west==1.5.0

      - name: Initialize the published manifest and SDK
        timeout-minutes: 15
        run: |
          west init -l "$GITHUB_WORKSPACE"
          west config --local -- manifest.project-filter '-.*,+zephyr,+mlkem-native,+mldsa-native,+mbedtls,+tf-psa-crypto'
          west update --narrow
          west packages pip --install --ignore-venv-check
          west sdk install --version 1.0.1 --gnu-toolchains x86_64-zephyr-elf

      - name: Build and run public firmware checks
        run: python scripts/check_zephyr.py --output-root "$RUNNER_TEMP/firmware-smoke"

      - name: Retain build and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-zephyr-smoke
          path: ${{ runner.temp }}/firmware-smoke/*.log
          if-no-files-found: warn

  fleet-coordinator:
    name: Rust fleet coordinator
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pqcp_fleet_coordinator
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustc --version && cargo --version

      - name: Test locked dependency graph
        run: cargo test --locked --all-targets
