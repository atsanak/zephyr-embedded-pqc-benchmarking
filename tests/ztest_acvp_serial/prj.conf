# Zephyr Test - PQCP ACVP command library
CONFIG_ZTEST=y

CONFIG_PQCP=y
CONFIG_PQCP_MLKEM=y
CONFIG_PQCP_MLKEM_LEVEL_768=y
CONFIG_PQCP_MLDSA=y
CONFIG_PQCP_MLDSA_LEVEL_65=y
CONFIG_PQCP_ACVP=y
CONFIG_PQCP_ACVP_READLINE_TIMEOUT_MS=100

# Deterministic test-only RNG
CONFIG_PQCP_RNG_DETERMINISTIC_TEST=y

# Stack sizing for ML-DSA command tests
CONFIG_MAIN_STACK_SIZE=131072
CONFIG_ZTEST_STACK_SIZE=131072
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
