# Zephyr Test - PQCP ACVP known-answer vectors
CONFIG_ZTEST=y

CONFIG_PQCP=y
CONFIG_PQCP_ACVP=y
CONFIG_PQCP_MLKEM=y
CONFIG_PQCP_MLKEM_LEVEL_512=y
CONFIG_PQCP_MLKEM_LEVEL_768=y
CONFIG_PQCP_MLKEM_LEVEL_1024=y
CONFIG_PQCP_MLDSA=y
CONFIG_PQCP_MLDSA_LEVEL_44=y
CONFIG_PQCP_MLDSA_LEVEL_65=y
CONFIG_PQCP_MLDSA_LEVEL_87=y

# Test-only deterministic hooks for KAT coverage
CONFIG_PQCP_RNG_DETERMINISTIC_TEST=y

# Stack sizing for large KAT buffers
CONFIG_MAIN_STACK_SIZE=196608
CONFIG_ZTEST_STACK_SIZE=196608
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
