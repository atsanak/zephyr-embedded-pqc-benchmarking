# Zephyr Test - PQCP boot self-verification
CONFIG_ZTEST=y

CONFIG_PQCP=y
CONFIG_PQCP_MLKEM=y
CONFIG_PQCP_MLKEM_LEVEL_768=y
CONFIG_PQCP_MLDSA=y
CONFIG_PQCP_MLDSA_LEVEL_65=y

# The boot self-test requires the deterministic test RNG so the seed is
# reproducible and does not depend on platform entropy at SYS_INIT time.
CONFIG_PQCP_RNG_DETERMINISTIC_TEST=y
CONFIG_PQCP_KAT_BOOT_VERIFY=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_MAIN_STACK_SIZE=131072
CONFIG_ZTEST_STACK_SIZE=131072
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
