# PSA Driver Test Overlay
# Build with: west build -- -DOVERLAY_CONFIG=overlay-psa.conf

# Enable mbedTLS PSA Crypto
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_PSA_CRYPTO_C=y

# Enable PSA Drivers
CONFIG_PQCP_PSA_DRIVER=y
CONFIG_PQCP_PSA_DRIVER_MLDSA=y
CONFIG_PQCP_PSA_DRIVER_MLKEM=y

# PSA RNG
CONFIG_PQCP_RNG_PSA=y
