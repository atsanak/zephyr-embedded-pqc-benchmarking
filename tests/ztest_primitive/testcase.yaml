tests:
  pqcp.primitive.core:
    tags:
      - pqcp
      - primitive
    harness: ztest
    platform_allow:
      - qemu_x86_64
      - mps2/an385
      - nucleo_h743zi
    integration_platforms:
      - qemu_x86_64
    timeout: 180

  pqcp.primitive.psa:
    tags:
      - pqcp
      - primitive
      - psa
    harness: ztest
    platform_allow:
      - qemu_x86_64
    integration_platforms:
      - qemu_x86_64
    timeout: 180
    extra_args:
      - OVERLAY_CONFIG=overlay-psa.conf

  pqcp.primitive.no_entropy:
    tags:
      - pqcp
      - primitive
    harness: ztest
    platform_allow:
      - mps2/an385
    integration_platforms:
      - mps2/an385
    timeout: 180
    extra_args:
      - OVERLAY_CONFIG=overlay-no-entropy.conf
